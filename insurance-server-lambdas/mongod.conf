net:
  port: 27017
  bindIp: 0.0.0.0
  tls:
    mode: requireTLS
    certificateKeyFile: /etc/mongo-certs/mongo.pem
    CAFile: /etc/mongo-certs/ca.crt
    # CAFile is only used to validate the server's own leaf cert against our
    # local CA; without this flag, setting CAFile also makes mongod demand a
    # client certificate for every connection (full mTLS), which none of the
    # application services (auth, cs-server, mongo_seed) have been issued.
    allowConnectionsWithoutCertificates: true

storage:
  dbPath: /data/db
