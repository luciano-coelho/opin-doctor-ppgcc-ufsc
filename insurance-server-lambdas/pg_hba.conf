# TYPE    DATABASE        USER            ADDRESS                 METHOD

# Local unix-socket connections (used internally by postgres tooling)
local     all             all                                     trust

# All TCP connections must use TLS (hostssl) -- there is no plain "host"
# fallback below, so a non-SSL connection attempt is rejected outright,
# which is what enforces sslmode=require for the Resource Server.
hostssl   all             all             0.0.0.0/0               md5
hostssl   all             all             ::/0                    md5
