services:

  mtls:
    profiles:
      - main
      - dev
    build:
      context: ../mock-service-os/mock_mtls
    ports:
      - "443:443"
    # Needed for tc/netem (thesis/scripts/set_latency.sh) to inject artificial
    # latency on this container's egress interface for Experiment 1's WAN
    # scenarios. Not required for normal gateway operation.
    cap_add:
      - NET_ADMIN
    volumes:
      - ../mock-service-os/certs/:/app/certs/
      - ./participants.json:/app/mocks/participants.json
      - ./software_statement.json:/app/mocks/software_statement.json
    networks:
      default:
        aliases:
          - matls-auth.local
          - auth.local
          - matls-api.local
          - api.local
          - directory
    environment:
      - SSA_JWK_URL=http://localstack:4566/keystore/private_jwk.json
      # classic (RSA-4096) or pqc (ML-DSA-65) -- picks which server
      # certificate (mtls.crt/.key vs mtls_pqc.crt/.key) the gateway
      # presents during the TLS handshake. See
      # thesis/results/v2/experiment2 - PQC/DECISIONS.md, Decision 10.
      - CRYPTO_PROFILE=${CRYPTO_PROFILE:-classic}
    depends_on:
      localstack:
        condition: service_healthy

  mockapi:
    profiles:
      - main
    image: raidiam-insurance-lambdas:latest
    environment:
      JAVA_HOME: ${JAVA_HOME}
      DB_DRIVER: org.postgresql.Driver
      DB_PASSWORD: test
      DB_USERNAME: test
      DB_URL: jdbc:postgresql://psql:5432/mock?ssl=true&sslmode=require
      MOCKSERVICE_URL: api.local
      AWS_XRAY_CONTEXT_MISSING: IGNORE_ERROR
      MICRONAUT_ENVIRONMENTS: dev
      # classic (PS256/RSA, Experiment 1) or pqc (ML-DSA-65, Experiment 2) --
      # see mock-service-os/mock_as/crypto-profiles/ for the same switch on
      # the AS, and thesis/results/v2/experiment2 - PQC/DECISIONS.md (Decision
      # 9). ResponseSigningService (src/main/java/.../crypto/) reads this
      # ONCE at JVM boot (@PostConstruct) and never again -- mockapi MUST be
      # recreated (not just auth/mtls/mongo_seed) every time CRYPTO_PROFILE
      # changes, or its resource-response signing algorithm silently
      # desyncs from whatever the AS/client are actually using. Confirmed
      # empirically: a stale mockapi kept signing PS256 while auth/client
      # had already switched to pqc, corrupting RS byte/JWT-size figures
      # for whichever scenarios ran against it.
      CRYPTO_PROFILE: ${CRYPTO_PROFILE:-classic}
    ports:
      - "8081:8080"

  psql:
    profiles:
      - main
      - dev
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=test
      - POSTGRES_USER=test
      - POSTGRES_DB=mock
    ports:
      - "5432:5432"
    volumes:
      - ../mock-service-os/certs/:/certs-src/:ro
      - ./pg_hba.conf:/etc/postgresql-custom/pg_hba.conf:ro
    # The bind-mounted key file from the host cannot be trusted to land inside
    # the container with 0600 perms (Windows/Docker Desktop file sharing does
    # not preserve Unix permission bits), and Postgres refuses to start with a
    # world/group-readable key. So we copy the certs into a container-local,
    # postgres-owned path with correct perms before handing off to the real
    # entrypoint, instead of editing postgresql.conf in the image directly
    # (there isn't one to edit -- it's generated by initdb on first boot).
    entrypoint: >
      sh -c "
        mkdir -p /var/lib/postgresql/certs &&
        cp /certs-src/postgres.crt /certs-src/postgres.key /var/lib/postgresql/certs/ &&
        chown postgres:postgres /var/lib/postgresql/certs/postgres.crt /var/lib/postgresql/certs/postgres.key &&
        chmod 644 /var/lib/postgresql/certs/postgres.crt &&
        chmod 600 /var/lib/postgresql/certs/postgres.key &&
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/certs/postgres.crt -c ssl_key_file=/var/lib/postgresql/certs/postgres.key -c hba_file=/etc/postgresql-custom/pg_hba.conf
      "

  auth:
    profiles:
      - main
      - dev
    build:
      context: ../mock-service-os/mock_as
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/?tls=true&tlsCAFile=/certs/ca.crt
      - AWS_ACCESS_KEY_ID="test"
      - AWS_SECRET_ACCESS_KEY="test"
      - AWS_HOST=http://localstack:4566
      - PORT=3000
      - BRAND=OPIN_LOCAL
      - AWS_XRAY_CONTEXT_MISSING=IGNORE_ERROR
      - LOCAL_STACK_ENDPOINT=http://localstack:4566
      - AWS_LOCAL=true
      - DEBUG=raidiam:server:*,oidc-provider:*
      - TRUSTFRAMEWORK_SSA_KEYSET=http://localstack:4566/keystore/jwks.json
      # classic (PS256/RSA, Experiment 1) or pqc (ML-DSA-65, Experiment 2) --
      # see mock-service-os/mock_as/crypto-profiles/ and
      # thesis/results/v2/experiment2 - PQC/DECISIONS.md (Decision 9).
      # IMPORTANT: mockapi reads this same variable and also only applies it
      # at boot -- recreate BOTH together on every profile switch, e.g.:
      # CRYPTO_PROFILE=pqc docker-compose --profile main up -d --force-recreate auth mtls mongo_seed mockapi
      - CRYPTO_PROFILE=${CRYPTO_PROFILE:-classic}
      # Conformance Suite diagnostic only (Decision 6/7) -- publishes a decoy
      # classical JWKS instead of the real ML-DSA-65 one. Off by default:
      # opin_flow.py, which actually drives Experiment 2, needs the real key
      # published. Set JWKS_SHADOW=1 only if re-running CS diagnostics.
      - JWKS_SHADOW=${JWKS_SHADOW:-0}
    ports:
      - 3000:3000
    command: ["node", "lambda.js"]
    volumes:
      - ../mock-service-os/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      localstack:
        condition: service_healthy
      mongodb:
        condition: service_started

  localstack:
    profiles:
      - main
      - dev
    image: localstack/localstack:4.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ssm,s3
      - AWS_ACCESS_KEY_ID="test"
      - AWS_SECRET_ACCESS_KEY="test"
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      # Picks which of the two cert pairs below setup_ssm.sh pushes to SSM
      # as the AS's own transport_certificate/transport_key (used by
      # mock_as's InsurerAdapter for its own AS->RS backend calls -- see
      # thesis/results/v2/experiment2 - PQC/DECISIONS.md, Decision 10).
      - CRYPTO_PROFILE=${CRYPTO_PROFILE:-classic}
    volumes:
      - ../mock-service-os/setup_ssm.sh:/etc/localstack/init/ready.d/init-aws.sh
      - /var/run/docker.sock:/var/run/docker.sock
      - ../mock-service-os/certs/op.key:/init/certs/client_classic.key
      - ../mock-service-os/certs/op.crt:/init/certs/client_classic.crt
      - ../mock-service-os/certs/op_pqc.key:/init/certs/client_pqc.key
      - ../mock-service-os/certs/op_pqc.crt:/init/certs/client_pqc.crt
      - ../mock-service-os/certs/op_hybrid.key:/init/certs/client_hybrid.key
      - ../mock-service-os/certs/op_hybrid.crt:/init/certs/client_hybrid.crt
      - ../mock-service-os/ssa/jwks.json:/init/ssa/jwks.json
      - ../mock-service-os/ssa/private_jwk.json:/init/ssa/private_jwk.json
      - config:/init/config
    healthcheck:
      test: [ "CMD-SHELL", "if [ -s /init/config/config.txt ]; then exit 0; else exit 1; fi" ]
      interval: 5s
      retries: 5
      timeout: 5s

  cs-httpd:
    profiles:
      - cs
    build:
      context: ./conformance-suite/httpd
      dockerfile: Dockerfile-static
    ports:
      - "8443:8443"
    volumes:
      - ./conformance-suite/src/main/resources/:/usr/local/apache2/htdocs/
    depends_on:
      - cs-server
    networks:
      default:
        aliases:
          - localhost.emobix.co.uk

  cs-server:
    profiles:
      - cs
    hostname: server
    image: openjdk:17-jdk-slim
    build:
      context: ./conformance-suite/server-dev
    ports:
      - "9999:9999"
    volumes:
      - ./conformance-suite/target/:/server/
      - ../mock-service-os/certs/ca.crt:/certs/ca.crt:ro
      # Registers BouncyCastle as an additional java.security.Provider (not
      # the full BCJSSE TLS provider) -- fixes ValidateMTLSCertificatesAsX509's
      # NPE on an ML-DSA-65 client cert's null PublicKey, without touching
      # the suite's own jar. Gets the CS as far as Layer 3 (a hardcoded RSA
      # assumption in its own compiled code) before hitting a wall no
      # provider registration can clear. Sourced from thesis/patches/, not
      # conformance-suite/, since that whole directory is gitignored
      # (cloned on demand) -- see thesis/results/experiment2 -
      # PQC/DECISIONS.md, Decision 7, and thesis/patches/README.md.
      - ../thesis/patches/conformance-suite/extra-libs/:/extra-libs/:ro
    # The Mongo driver bundled in this jar (4.6.1) predates the tlsCAFile
    # connection-string option, so it falls back to the JVM's default cacerts
    # truststore -- which doesn't know our local CA and fails with a PKIX
    # path-building error. Import the CA directly into the JVM's own default
    # cacerts (rather than pointing -Djavax.net.ssl.trustStore at a separate,
    # CA-only truststore): that system property *replaces* the default trust
    # store instead of extending it, which broke every other HTTPS call the
    # suite makes to hosts trusted by the public CA bundle.
    # `|| true`: this entrypoint reruns on every container start, but
    # `docker exec ... restart` (as opposed to recreate) reuses the same
    # writable filesystem layer, so a second run hits "already exists" and
    # keytool exits non-zero -- which, chained with `&&`, silently prevented
    # `exec "$@"` from ever running and left the container with no server
    # process. The import only needs to succeed once per filesystem; failing
    # to re-import an already-present alias isn't a real error.
    entrypoint:
      - sh
      - -c
      - keytool -importcert -noprompt -alias mockopin-ca -keystore /opt/java/openjdk/lib/security/cacerts -storepass changeit -file /certs/ca.crt || true; exec "$@"
      - --
    # Explicit YAML list, not a folded string: docker-compose's string-command
    # parser truncates at a bare "&" (needed here for the Mongo URI query
    # string), silently dropping everything after it. A list sidesteps that
    # parsing entirely -- each item is passed through as one argv element.
    command:
      - java
      - -Xdebug
      - -Xrunjdwp:transport=dt_socket,address=*:9999,server=y,suspend=n
      - -Dspring.data.mongodb.uri=mongodb://mongodb:27017/test_suite?tls=true&tlsCAFile=/certs/ca.crt
      # Additive (no leading "="): appends to, doesn't replace, the JVM's
      # default provider list. Must come before -cp/the class name -- like
      # -jar, everything after the class name is a program arg to Spring
      # Boot, not a JVM option, so it'd silently do nothing placed later
      # (as -Djdk.tls.maxHandshakeMessageSize and the other -D flags below
      # already are, pre-existing, unchanged from before this experiment).
      - -Djava.security.properties=/extra-libs/bc.security
      # -cp + JarLauncher instead of -jar: -jar ignores any classpath
      # addition (manifest Class-Path only), so this is needed to put the
      # BouncyCastle jars anywhere the JVM's provider loader can see them.
      # JarLauncher is fapi-test-suite.jar's own Main-Class (a Spring Boot
      # fat jar) -- using it directly here reproduces exactly what -jar did,
      # plus the classpath addition.
      - -cp
      - /server/fapi-test-suite.jar:/extra-libs/bcprov-jdk18on-1.79.jar:/extra-libs/bcutil-jdk18on-1.79.jar
      - org.springframework.boot.loader.JarLauncher
      - -Djdk.tls.maxHandshakeMessageSize=65536
      - -Dcom.sun.net.ssl.checkRevocation=false
      - -Dcom.sun.net.ssl.trustStoreType=JKS
      - -Dcom.sun.net.ssl.trustStorePassword=changeit
      - --fintechlabs.base_url=https://localhost.emobix.co.uk:8443
      - --fintechlabs.base_mtls_url=https://localhost.emobix.co.uk:8444
      - --fintechlabs.devmode=true
      - --fintechlabs.startredir=true
      - --fintechlabs.yacs.directory.uri=http://directory/participants
    depends_on:
      - mongodb
    logging:
      # limit logs retained on host
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"

  mongodb:
    profiles:
      - main
      - dev
      - cs
    image: mongo:latest
    volumes:
      - mongo-data:/data/db
      - ../mock-service-os/certs/mongo.pem:/certs-src/mongo.pem:ro
      - ../mock-service-os/certs/ca.crt:/certs-src/ca.crt:ro
      - ./mongod.conf:/etc/mongo-custom/mongod.conf:ro
    # Same reasoning as the psql service: copy certs into a container-local
    # path with safe permissions before mongod reads them, since the host
    # bind mount can't be trusted to carry correct Unix perms.
    entrypoint: >
      sh -c "
        mkdir -p /etc/mongo-certs &&
        cp /certs-src/mongo.pem /certs-src/ca.crt /etc/mongo-certs/ &&
        chmod 600 /etc/mongo-certs/mongo.pem &&
        chmod 644 /etc/mongo-certs/ca.crt &&
        exec mongod --config /etc/mongo-custom/mongod.conf
      "

  mongo_seed:
    profiles:
      - main
      - dev
    build:
      context: ../mock-service-os/mock_as/mongo-seed
    command: ["/start.sh", "mongodb:27017"]
    environment:
      # Must match whatever auth/mockapi are running with -- start.sh uses
      # this to set client_one/client_two's id_token_signed_response_alg,
      # which oidc-provider validates on every authentication regardless
      # of grant type. Rerun this service (docker-compose --profile main
      # run --rm --build mongo_seed) after switching CRYPTO_PROFILE.
      - CRYPTO_PROFILE=${CRYPTO_PROFILE:-classic}
    volumes:
      - ../mock-service-os/certs/:/certs/
    depends_on:
      - mongodb

  cs-builder:
    profiles:
      - build-only
    image: maven:3-openjdk-17
    volumes:
      - maven-cache:/root/.m2
      - ./conformance-suite:/usr/src/mymaven
    working_dir: /usr/src/mymaven
    command: mvn -B clean package -DskipTests=true

volumes:
  config:
    driver: local
  maven-cache:
    driver: local
  mongo-data:
    driver: local
