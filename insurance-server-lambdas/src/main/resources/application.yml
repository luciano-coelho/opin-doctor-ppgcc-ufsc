micronaut:
  application:
    name: lambdas
  security:
    enabled: true
  server:
    netty:
      # Netty's own default is 8192 (8KB) per HTTP header. The gateway
      # (mock_mtls) forwards the client's full mTLS certificate PEM as the
      # BANK-TLS-Certificate header (Open Finance Brasil parity) -- fine at
      # classic's ~2KB and pqc's ~4KB, but hybrid's certificate (Etapa 6:
      # RSA cert plus an embedded ML-DSA-65 public key and alt signature,
      # ~1952 + ~3309 raw bytes) PEM-encodes to ~9.3KB, already over the
      # default on its own. Raised well past that so headroom isn't
      # re-exhausted by routine growth. See thesis/results/v4/DECISIONS.md,
      # Etapa 7.
      max-header-size: 32768
  data:
    pageable:
      max-page-size: 50000
      default-page-size: 25
      size-parameter-name: "page-size"

jackson:
  serialization:
    writeDatesAsTimestamps: true
  serialization-inclusion: NON_ABSENT

jpa:
  default:
    entity-scan:
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        show_sql: false

flyway:
  datasources:
    default:
      locations:
        - classpath:db/migration
        - classpath:db/dataloading
      enabled: false

datasources:
  default:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driverClassName: ${DB_DRIVER}
    jdbc-interceptors: com.amazonaws.xray.sql.postgres.TracingInterceptor
    initialSize: 2
    minIdle: 2
    maxIdle: 5
    maxActive: 10
    minEvictableIdleTimeMillis: 15000
    removeAbandoned: true
    testOnBorrow: true

aws:
  region: ${REGION:region}

mockinsurance:
  mockinsuranceUrl: ${MOCKSERVICE_URL:matls-api.mockinsurance.poc.raidiam.io}
  max-page-size: 25
  # classic (PS256/RSA, Experiment 1) or pqc (ML-DSA-65, Experiment 2) --
  # see crypto-profiles/ resources and ResponseSigningService, and
  # thesis/results/experiment2 - PQC/DECISIONS.md.
  crypto-profile: ${CRYPTO_PROFILE:classic}

trustframework:
  issuer: 74e929d9-33b6-4d85-8ba7-c146c867a817
  audience: 74e929d9-33b6-4d85-8ba7-c146c867a817
